name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,anthropic,ner]"
      - run: python -m spacy download fr_core_news_sm && python -m spacy download en_core_web_sm
      - run: ruff check .
      - run: mypy talentengine
      - run: pytest -q
      - name: Shield measurements (published in docs/MEASUREMENTS.md)
        run: |
          python eval/pii_recall.py --ner | tee -a "$GITHUB_STEP_SUMMARY"
          python eval/pii_recall.py --ner --heldout | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Front-end (typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: docker build -t talentengine-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name te -p 8000:8000 -e TE_VISION_DETECTOR=none talentengine-ai:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/api/demo/seed > /dev/null
          curl -fsS localhost:8000/api/audit/verify | grep -q '"valid":true'
          curl -fsS localhost:8000/ | grep -qi '<div id="root"'
          docker exec te python -c "from talentengine.shield.ner import SpacyNer; assert SpacyNer().persons('Avec Sophie Bernard.')"
          docker exec te python -c "from talentengine.assessment.bank import load_bank; assert len(load_bank()) >= 200"
          docker exec te git --version
      - run: docker build -t talentengine-runner:ci runner/
      - name: Runner smoke test (production hardening, no network)
        run: |
          docker network create --internal runnernet
          docker run -d --name runner --network runnernet -e RUNNER_TOKEN=ci --read-only \
            --tmpfs /tmp:size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 2g talentengine-runner:ci
          sleep 3
          cat > job.json <<'JSON'
          {"files": {"tests/test_ok.py": "import socket\n\ndef test_math():\n    assert 1 + 1 == 2\n\ndef test_no_network():\n    s = socket.socket()\n    s.settimeout(2)\n    try:\n        s.connect(('1.1.1.1', 443))\n        raise AssertionError('network reachable')\n    except OSError:\n        pass\n"}, "tests": ["tests"], "timeout": 20}
          JSON
          docker run --rm --network runnernet -v "$PWD/job.json:/job.json:ro" python:3.12.7-slim python -c "
          import json, urllib.request
          req = urllib.request.Request('http://runner:8090/run', data=open('/job.json','rb').read(), headers={'X-Runner-Token': 'ci', 'Content-Type': 'application/json'})
          r = json.load(urllib.request.urlopen(req, timeout=60))
          print(r['passed'], 'passed', r['failed'], 'failed')
          assert r['passed'] == 2 and r['failed'] == 0, r['output']"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Full history on every push (the official image, pinned); .gitleaksignore lists reviewed false positives.
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner --verbose
