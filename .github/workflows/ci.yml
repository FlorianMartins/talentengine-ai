name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,anthropic]"
      - run: ruff check .
      - run: mypy talentengine
      - run: pytest -q

  frontend:
    name: Front-end (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t talentengine-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name te -p 8000:8000 -e TE_VISION_DETECTOR=none talentengine-ai:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/api/demo/seed > /dev/null
          curl -fsS localhost:8000/api/audit/verify | grep -q '"valid":true'
          curl -fsS localhost:8000/ | grep -qi '<div id="root"'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
