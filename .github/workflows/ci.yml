name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,anthropic,ner]"
      - run: python -m spacy download fr_core_news_sm && python -m spacy download en_core_web_sm
      - run: ruff check .
      - run: mypy talentengine
      - run: pytest -q
      - name: Shield measurements (published in docs/MEASUREMENTS.md)
        run: |
          python eval/pii_recall.py --ner | tee -a "$GITHUB_STEP_SUMMARY"
          python eval/pii_recall.py --ner --heldout | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Front-end (typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t talentengine-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name te -p 8000:8000 -e TE_VISION_DETECTOR=none talentengine-ai:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/api/demo/seed > /dev/null
          curl -fsS localhost:8000/api/audit/verify | grep -q '"valid":true'
          curl -fsS localhost:8000/ | grep -qi '<div id="root"'
          docker exec te python -c "from talentengine.shield.ner import SpacyNer; assert SpacyNer().persons('Avec Sophie Bernard.')"
          docker exec te python -c "from talentengine.assessment.bank import load_bank; assert len(load_bank()) >= 200"
          docker exec te git --version

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full history on every push (the official image, pinned); .gitleaksignore lists reviewed false positives.
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner --verbose
