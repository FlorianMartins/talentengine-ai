[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "talentengine-ai"
version = "0.5.0"
description = "Skills-first, privacy-first applicant evaluation engine (EU AI Act / GDPR by design)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Florian Martins" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pillow>=10.4",
  "pypdf>=4.3",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Commercial escalation tier (Module 2, level 2). Local-first: never required.
anthropic = ["anthropic>=1.0"]
# Statistical person-name detection (Module 1). Then: python -m spacy download fr_core_news_sm en_core_web_sm
ner = ["spacy>=3.7"]
# Classic face detector used when no local vision-language model is reachable.
vision = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100"]

[project.scripts]
talentengine = "talentengine.cli:main"

[tool.setuptools.packages.find]
include = ["talentengine*"]

[tool.setuptools.package-data]
talentengine = ["assessment/bank/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"eval/*" = ["S311", "E402"]
"talentengine/compliance.py" = ["E501"]  # Markdown template: table rows stay on one line
# Data tables (presets, vocabularies, tool and dependency lists) read better one entry per line.
"talentengine/dashboard/presets.py" = ["E501"]
"talentengine/funnel/crossrepo.py" = ["E501"]
"talentengine/funnel/documents.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
