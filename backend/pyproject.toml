[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "talentengine-ai"
version = "0.1.0"
description = "Skills-first, privacy-first applicant evaluation engine (EU AI Act / GDPR by design)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Florian Martins" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pillow>=10.4",
  "pypdf>=4.3",
  "cryptography>=43",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Commercial escalation tier (Module 2, level 2). Local-first: never required.
anthropic = ["anthropic>=1.0"]
# Classic face detector used when no local vision-language model is reachable.
vision = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
talentengine = "talentengine.cli:main"

[tool.setuptools.packages.find]
include = ["talentengine*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
